name: Harness checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run real Jev evaluation (uses JEV_API_KEY secret)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm test
      - if: github.event_name == 'workflow_dispatch' && inputs.live
        run: npm run test:live
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
